<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <header class="bg-blue-600 text-white p-4">
    <h1 class="text-2xl font-bold">AI Platform</h1>
  </header>
  <main class="max-w-4xl mx-auto mt-8 p-4">
    <section class="text-center">
      <h2 class="text-3xl font-semibold">Welcome to Our AI-Powered Platform</h2>
      <p class="mt-4 text-lg">Create amazing content with the power of Open AI.</p>
      <a href="/signup" class="mt-6 inline-block bg-blue-600 text-white px-6 py-3 rounded-lg">Get Started</a>
    </section>
    <section class="mt-12">
      <h3 class="text-2xl font-semibold text-center">Features</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
        <div class="bg-white p-4 rounded-lg shadow">
          <h4 class="text-xl font-medium">Text Generation</h4>
          <p>Generate creative content effortlessly.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <h4 class="text-xl font-medium">Scalable</h4>
          <p>Built for growth and performance.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <h4 class="text-xl font-medium">User-Friendly</h4>
          <p>Intuitive design for all users.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
