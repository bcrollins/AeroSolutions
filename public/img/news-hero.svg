      <line x1="0" y1="45" x2="60" y2="45" stroke="white" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Right side decorative element -->
  <g transform="translate(1000, 200)">
    <circle cx="0" cy="0" r="60" fill="url(#accentGradient)" opacity="0.8"/>
    <g transform="translate(-30, -30)">
      <path d="M0 0V60H60V0H0ZM30 50C25 50 20 45 20 40C20 35 25 30 30 30C35 30 40 35 40 40C40 45 35 50 30 50ZM45 15C45 17.5 42.5 20 40 20C37.5 20 35 17.5 35 15C35 12.5 37.5 10 40 10C42.5 10 45 12.5 45 15ZM25 15C25 17.5 22.5 20 20 20C17.5 20 15 17.5 15 15C15 12.5 17.5 10 20 10C22.5 10 25 12.5 25 15Z" fill="white"/>
