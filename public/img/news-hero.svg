    <circle cx="600" cy="200" r="160" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="600" cy="200" r="200" stroke="white" stroke-width="0.5" fill="none"/>
    <circle cx="600" cy="200" r="240" stroke="white" stroke-width="0.5" fill="none"/>
