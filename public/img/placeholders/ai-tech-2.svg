<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <rect width="800" height="400" fill="url(#blueGradient)"/>
  
  <!-- Circuit board patterns -->
  <g opacity="0.15">
    <path d="M0 100H800" stroke="white" stroke-width="1"/>
    <path d="M0 200H800" stroke="white" stroke-width="1"/>
    <path d="M0 300H800" stroke="white" stroke-width="1"/>
    
    <path d="M100 0V400" stroke="white" stroke-width="1"/>
    <path d="M200 0V400" stroke="white" stroke-width="1"/>
    <path d="M300 0V400" stroke="white" stroke-width="1"/>
    <path d="M400 0V400" stroke="white" stroke-width="1"/>
    <path d="M500 0V400" stroke="white" stroke-width="1"/>
    <path d="M600 0V400" stroke="white" stroke-width="1"/>
    <path d="M700 0V400" stroke="white" stroke-width="1"/>
    
    <!-- Circuit components -->
    <circle cx="100" cy="100" r="10" fill="white"/>
    <circle cx="300" cy="100" r="10" fill="white"/>
    <circle cx="500" cy="100" r="10" fill="white"/>
    <circle cx="700" cy="100" r="10" fill="white"/>
    
    <circle cx="200" cy="200" r="10" fill="white"/>
    <circle cx="400" cy="200" r="10" fill="white"/>
    <circle cx="600" cy="200" r="10" fill="white"/>
    
    <circle cx="100" cy="300" r="10" fill="white"/>
    <circle cx="300" cy="300" r="10" fill="white"/>
    <circle cx="500" cy="300" r="10" fill="white"/>
    <circle cx="700" cy="300" r="10" fill="white"/>
  </g>
  
  <!-- Abstract data visualization -->
  <g transform="translate(350, 150)">
    <rect x="-50" y="-50" width="100" height="100" rx="10" fill="url(#cyanGradient)" opacity="0.9"/>
    <path d="M-25 0L-15 -15L0 5L15 -25L25 -5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-25" cy="0" r="4" fill="white"/>
    <circle cx="-15" cy="-15" r="4" fill="white"/>
    <circle cx="0" cy="5" r="4" fill="white"/>
    <circle cx="15" cy="-25" r="4" fill="white"/>
    <circle cx="25" cy="-5" r="4" fill="white"/>
  </g>
  
  <!-- Category label -->
  <rect x="50" y="30" width="150" height="30" rx="15" fill="#000000" fill-opacity="0.6"/>
  <text x="125" y="50" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle">Business Intelligence</text>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="50" r="25" fill="url(#cyanGradient)" opacity="0.6"/>
  <circle cx="730" cy="80" r="15" fill="url(#cyanGradient)" opacity="0.4"/>
  <circle cx="670" cy="70" r="20" fill="url(#cyanGradient)" opacity="0.2"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C4A6E"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="-50" y1="-50" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
</svg>