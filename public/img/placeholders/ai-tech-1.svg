    <circle cx="250" cy="150" r="5" fill="#4F46E5"/>
    <circle cx="350" cy="100" r="5" fill="#4F46E5"/>
    <circle cx="450" cy="150" r="5" fill="#4F46E5"/>
    <circle cx="550" cy="100" r="5" fill="#4F46E5"/>
    <circle cx="650" cy="150" r="5" fill="#4F46E5"/>
    
    <circle cx="200" cy="200" r="5" fill="#4F46E5"/>
    <circle cx="300" cy="250" r="5" fill="#4F46E5"/>
    <circle cx="400" cy="200" r="5" fill="#4F46E5"/>
    <circle cx="500" cy="250" r="5" fill="#4F46E5"/>
    <circle cx="600" cy="200" r="5" fill="#4F46E5"/>
    
    <circle cx="150" cy="300" r="5" fill="#4F46E5"/>
    <circle cx="250" cy="350" r="5" fill="#4F46E5"/>
    <circle cx="350" cy="300" r="5" fill="#4F46E5"/>
    <circle cx="450" cy="350" r="5" fill="#4F46E5"/>
    <circle cx="550" cy="300" r="5" fill="#4F46E5"/>
    <circle cx="650" cy="350" r="5" fill="#4F46E5"/>
    
