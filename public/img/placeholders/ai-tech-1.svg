    <line x1="150" y1="100" x2="250" y2="150" stroke="#4F46E5" stroke-width="1"/>
    <line x1="250" y1="150" x2="350" y2="100" stroke="#4F46E5" stroke-width="1"/>
    <line x1="350" y1="100" x2="450" y2="150" stroke="#4F46E5" stroke-width="1"/>
    <line x1="450" y1="150" x2="550" y2="100" stroke="#4F46E5" stroke-width="1"/>
    <line x1="550" y1="100" x2="650" y2="150" stroke="#4F46E5" stroke-width="1"/>
    
    <line x1="150" y1="100" x2="200" y2="200" stroke="#4F46E5" stroke-width="1"/>
    <line x1="250" y1="150" x2="300" y2="250" stroke="#4F46E5" stroke-width="1"/>
    <line x1="350" y1="100" x2="400" y2="200" stroke="#4F46E5" stroke-width="1"/>
    <line x1="450" y1="150" x2="500" y2="250" stroke="#4F46E5" stroke-width="1"/>
    <line x1="550" y1="100" x2="600" y2="200" stroke="#4F46E5" stroke-width="1"/>
    
