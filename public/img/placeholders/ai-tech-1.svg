    <line x1="300" y1="250" x2="400" y2="200" stroke="#4F46E5" stroke-width="1"/>
    <line x1="400" y1="200" x2="500" y2="250" stroke="#4F46E5" stroke-width="1"/>
    <line x1="500" y1="250" x2="600" y2="200" stroke="#4F46E5" stroke-width="1"/>
    
