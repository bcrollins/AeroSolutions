<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <header class="bg-blue-600 text-white p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">AI Platform</h1>
      <nav>
        <a href="/" class="text-white hover:text-blue-200">Home</a>
      </nav>
    </div>
  </header>
  <main class="max-w-md mx-auto mt-16 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-6 text-center">Login to Your Account</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded" required>
      </div>
      <div>
        <label for="password" class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded" required>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-blue-600">
          <label for="remember" class="ml-2 text-gray-700">Remember me</label>
        </div>
        <a href="#" class="text-blue-600 hover:underline text-sm">Forgot password?</a>
      </div>
      <div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
          Login
        </button>
      </div>
    </form>
    <div class="mt-4 text-center">
      <p class="text-gray-600">Don't have an account? <a href="/signup" class="text-blue-600 hover:underline">Sign up</a></p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // This is just for demonstration - in a real app, you would send this to your backend API
        alert(`Login attempt with email: ${email}\nThis is a demo login page. In a real app, this would connect to your authentication API.`);
        
        // Clear form
        loginForm.reset();
      });
    });
  </script>
</body>
</html>
